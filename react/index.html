<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e2413" />
  <meta name="description" content="Agroscope — satellite-driven crop rotation and field decision support for Bangladeshi farmers. Climate, soil, suitability, risk and rotation planning in one place." />
  <title>Agroscope · Field Shift — Crop Rotation Decision Support</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Load webfonts only after the page is interactive so an offline/slow
    // network never blocks rendering or the load event; system fallbacks apply.
    window.addEventListener("load", function () {
      var l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap";
      document.head.appendChild(l);
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="max-width:640px;margin:80px auto;padding:24px;font-family:system-ui,sans-serif;color:#112915;text-align:center">
      <h1 style="font-size:1.6rem;margin:0 0 12px">Agroscope needs JavaScript</h1>
      <p style="line-height:1.6;color:#3D5B45">This field decision-support app runs entirely in your browser with React. Please enable JavaScript to continue.</p>
    </div>
  </noscript>

  <!-- vendor: React 18 UMD + htm (no build step) -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/htm.min.js"></script>

  <!-- data + foundations -->
  <script src="src/data.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/charts.js"></script>
  <script src="src/store.js"></script>

  <!-- ui + sections -->
  <script src="src/ui.js"></script>
  <script src="src/hero.js"></script>
  <script src="src/map.js"></script>
  <script src="src/form.js"></script>
  <script src="src/sections.js"></script>
  <script src="src/auth.js"></script>

  <!-- mount -->
  <script src="src/app.js"></script>
</body>
</html>
